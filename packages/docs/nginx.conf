server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# adapter-static (kit.paths.trailingSlash default "never") writes each
	# route as a flat "<route>.html" file (docs/getting-started.html), not
	# "<route>/index.html" ; nginx's own default config only auto-appends
	# "index.html" for a directory request, so every non-root page 404'd
	# until this "try the .html file too" fallback was added (verified live).
	location / {
		try_files $uri $uri.html $uri/ =404;
	}
}
