[files]
extend-exclude = [
    # releaser-generated, full of commit-hash substrings (e.g. the "ba"
    # inside "2ba0da5") that read as typos with no prose to actually fix.
    "CHANGELOG.md",
    # Generated from the Zod/OpenAPI registry, not hand-written prose.
    "openapi.json",
    "src/lib/api/v1.d.ts",
    # Machine-translated UI strings in a dozen locales, none of them English.
    "messages/",
    # Expected renders of those strings, French and Russian among them.
    "src/lib/i18n-plurals.test.ts",
]

[default.extend-words]
# Go's compress/flate package.
flate = "flate"
