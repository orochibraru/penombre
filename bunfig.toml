[test]
preload = ["./test.setup.ts"]
coverage = true
coveragePathIgnorePatterns = [
    "**/test.setup.ts",
    "**/paraglide/**",
    "**/test.setup.ts",
    "**/*.spec.ts",
    "**/test-utils.ts",
    "**/mocks/**",
    "**/types/**",
    "**/schema.ts",
    "**/*.test.ts",
    "**/*.e2e.ts",
    "*.config.js",
    "*.config.ts",
    "dist/**",
    "build/**",
    ".next/**",
    "generated/**",
    "vendor/**",
    "src/utils/constants.ts",
    "src/types/**",
]
pathIgnorePatterns = ["node_modules/**", "**/e2e/**", "fixtures/**"]

coverageThreshold = { line = 0.7, function = 0.8, statement = 0.9 }

[run]
bun = true
