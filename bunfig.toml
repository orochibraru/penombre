[test]
preload = ["./test.setup.ts"]
rerunEach = 3
coverage = true
coveragePathIgnorePatterns = [
	"**/test.setup.ts",
	"**/paraglide/**",
	"**/test.setup.ts",
	"**/*.spec.ts",
	"**/test-utils.ts",
	"**/mocks/**",
	"**/types/**",
	"**/schema.ts",
	"**/schema.pg.ts",
	"**/schema.sqlite.ts",
	"**/test-helpers.ts",
	"**/*.test.ts",
	"**/*.e2e.ts",
	"*.config.js",
	"*.config.ts",
	"dist/**",
	"build/**",
	".next/**",
	"generated/**",
	"vendor/**",
	"src/utils/constants.ts",
	"src/types/**",
]
pathIgnorePatterns = ["node_modules/**", "**/e2e/**", "fixtures/**"]

coverageThreshold = { lines = 0.7, functions = 0.8, statements = 0.9 }

[run]
bun = true

[fmt]
useTabs = true
tabWidth = 2
ignorePatterns = [
	"CHANGELOG.md",
	"openapi.json",
	"drizzle/",
	"project.inlang/",
	"static/",
	".github/",
	"**/*.svg",
]

[fmt.sortImports]
newlinesBetween = true

[[fmt.overrides]]
files = ["*.md"]
options = { useTabs = false, proseWrap = "always" }
