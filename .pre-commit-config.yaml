repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

      - id: check-case-conflict

      - id: detect-private-key

      - id: check-yaml

      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: &generated |-
          (?x)^(
            src/lib/api/v1\.(json|d\.ts)|
            openapi.json|
            \.example\.env|
            drizzle/|
            CHANGELOG\.md|
            bun\.lock
          )
      - id: end-of-file-fixer
        exclude: *generated

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      # These run first: .example.env and the OpenAPI spec + its typed client
      # are derived from source that may itself be part of this commit.
      - id: gen-env
        name: regenerate .example.env
        entry: bun run gen:env
        language: system
        pass_filenames: false
        files: ^(src/lib/server/config\.defaults\.ts|scripts/generate-env-example\.ts)$

      - id: biome
        name: biome check --write --unsafe
        entry: bun run biome format
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: prettier-md
        name: prettier (markdown)
        entry: bun run prettier --log-level warn --write
        language: system
        types: [markdown]

      - id: markdownlint
        name: markdownlint-cli2 --fix
        entry: bunx markdownlint-cli2 --fix
        language: system
        types: [markdown]

      - id: test-unit
        name: bun test
        entry: bun test
        language: system
        pass_filenames: false
        files: ^(src/|test\.setup\.ts$|bunfig\.toml$)

  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "route files: no manual $props()/load/actions typing (./$types is inferred)"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: no-raw-drizzle-in-routes
        name: "route files: no raw Drizzle queries (go through a DTO)"
        language: pygrep
        entry: \bdb\.(select|insert|update|delete)\(
        files: ^src/routes/.*\.ts$

      - id: internal-links-resolve
        name: "internal links go through resolve() from $app/paths"
        language: pygrep
        entry: href="/
        files: ^src/.*\.svelte$
