default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Look for Merge Conflicts

      - id: check-case-conflict
        name: Look for case conflicts

      - id: check-yaml
        name: Validate Yaml

      - id: check-added-large-files
        name: Look for large files

      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        exclude: &generated |-
          (?x)^(
            src/lib/api/v1\.(json|d\.ts)|
            openapi\.json|
            \.example\.env|
            drizzle/|
            CHANGELOG\.md|
            bun\.lock
          )

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated

      - id: trailing-whitespace
        name: Fix trailing whitespaces
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Ensure conventional commits
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        name: Look for typos
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint Github Actions

  - repo: local
    hooks:
      - id: pinact
        name: Pin Github Actions
        entry: pinact run
        language: golang
        additional_dependencies:
          - github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0
        files: ^\.github/(workflows|actions)/.*\.ya?ml$

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Docker

  - repo: local
    hooks:
      - id: gen
        name: Regenerate OpenAPI, typed client and .example.env
        entry: sh -c 'bun run gen:env && bun run gen:api'
        language: system
        pass_filenames: false
        files: ^(src/lib/server/openapi/|src/lib/server/config\.defaults\.ts$|scripts/gen)

      - id: oxlint
        name: Lint (oxlint)
        entry: node_modules/.bin/oxlint --type-aware --deny-warnings
        language: system
        require_serial: true
        files: \.(ts|tsx|js|jsx|mjs|cjs|svelte)$

      - id: format-go
        name: Formatting (Go)
        entry: gofmt -w
        language: system
        files: \.go$

      - id: test-go
        name: Tests (Go)
        entry: go test -race ./cmd/... ./internal/... ./tests/unit/go/... ./tests/integration/go/...
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: (\.go$|^go\.(mod|sum)$)

      - id: i18n
        name: Locale parity
        entry: bun scripts/check-i18n.ts
        language: system
        pass_filenames: false
        files: ^(messages/.*\.json|project\.inlang/settings\.json)$

      - id: biome
        name: Format and sort imports (Biome)
        entry: node_modules/.bin/biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        require_serial: true
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: format-md
        name: Formatting (MD)
        entry: node_modules/.bin/prettier --log-level warn --write
        language: system
        types: [markdown]

      - id: markdownlint
        name: Markdown Lint
        entry: node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]

      - id: lint-tailwind
        name: Lint (Tailwind)
        entry: node_modules/.bin/tailwint --fix
        language: system
        require_serial: true
        files: ^src/.*\.(svelte|css|html|ts)$

      - id: check
        name: Type Check
        entry: bun run check
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|scripts/|e2e/|messages/|vite\.config\.ts$|svelte\.config\.js$|tsconfig.*\.json$|.*\.go$|go\.(mod|sum)$|package\.json$|bun\.lock$)

      - id: circular
        name: Circular imports
        entry: bun run circular
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^src/.*\.ts$

      - id: test-unit
        name: Unit Tests
        entry: bun test
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|scripts/|test\.setup\.ts$|bunfig\.toml$|package\.json$|bun\.lock$)

      - id: bun-install
        name: Sync dependencies after checkout
        entry: bun install
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "Look for injected inferred types in routes"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: no-raw-drizzle-in-routes
        name: "Make sure DTOs are used in routes, not drizzle directly"
        language: pygrep
        entry: \bdb\.(select|insert|update|delete)\(
        files: ^src/routes/.*\.ts$

      - id: internal-links-resolve
        name: "Make sure all paths are resolved"
        language: pygrep
        entry: href="/
        files: ^src/.*\.svelte$
