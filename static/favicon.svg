<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="light" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#911f43"/>
      <stop offset="1" stop-color="#b94082"/>
    </linearGradient>
    <radialGradient id="shade" cx="31" cy="17" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0.72" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="eclipse">
      <rect width="48" height="48" fill="#fff"/>
      <circle cx="31" cy="17" r="20" fill="url(#shade)"/>
    </mask>
  </defs>

  <circle cx="24" cy="24" r="21" fill="url(#light)" mask="url(#eclipse)"/>
</svg>
