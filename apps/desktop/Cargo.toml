[package]
name = "penombre-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Keeps a local folder in two-way sync with a Penombre drive"
publish = false
# tests/ mirrors src/ and holds unit tests that src/ pulls in by #[path], not
# integration test crates.
autotests = false

[dependencies]
directories = "=6.0.0"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "=0.37.0"
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
# Same revision spotifast builds with; move them together.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
keyring-core = "=1.0.1"
# The app icon, from the logo's SVG; the version egui_extras already renders with.
resvg = { version = "=0.48.1", default-features = false }
log = "=0.4.34"
notify = "=8.2.0"
open = "=5.4.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

# macOS goes through UserNotifications or Script Editor (`notify.rs`).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "=4.18.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
# eframe's own winit, for its macOS event-loop options (the default menu).
winit = { version = "=0.30.13", default-features = false }
# The Dock icon, shown only while the window is open: the versions eframe uses.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSError", "NSString"] }
# The app's own notifications, and whether System Settings allows them.
block2 = "=0.6.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# `Tray::set_status` (the menu-bar percentage), on our fork until upstream has
# it. Drop this once crmne/fastframe tags a release with it.
[patch."https://github.com/crmne/fastframe"]
fastframe-tray = { git = "https://github.com/orochibraru/fastframe", rev = "12fe1e59d5f965f3520d0096eab1ca318170eb5c" }
