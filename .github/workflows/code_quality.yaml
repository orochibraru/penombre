name: Code Quality
# Static checks and unit tests. E2E lives in `e2e.yaml`.
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Run prek
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: test-unit
        with:
          extra-args: --all-files --no-fail-fast

      - name: Lint (MD)
        run: bun run lint:md

      - name: Lint (TS)
        run: bun run lint:ts

      - name: Lint (Tailwind)
        run: bun run lint:tailwind

      - name: Type check
        run: bun run check

      - name: Codegen is current (API & example env)
        run: |
          bun run gen
          bun run format:md
          bun run biome check --write --unsafe --no-errors-on-unmatched openapi.json .example.env
          if ! git diff --exit-code -- .example.env openapi.json src/lib/api; then
            echo "::error::Generated files are stale — run 'bun run gen:env && bun run gen:api' and commit the result."
            exit 1
          fi

  docs-check:
    name: Docs (Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build docs
        run: bun run docs:build

  ts-test:
    name: Tests (TS)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Compile messages
        run: bun run gen:paraglide

      - name: Tests (Unit)
        run: bun test --bail
