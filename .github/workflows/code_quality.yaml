name: Code Quality
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Run prek
        uses: j178/prek-action@v3.0.0
        env:
          SKIP: test-unit
        with:
          extra-args: --all-files --no-fail-fast

  docs-check:
    name: Docs (Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build docs
        run: bun run docs:build

  ts-test:
    name: Tests (TS)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      # Paraglide output is gitignored and only written by the Vite plugin, so
      # a fresh checkout has none — anything under test that imports messages
      # would fail to resolve.
      - name: Compile messages
        run: bun run gen:paraglide

      - name: Tests (Unit)
        run: bun test --bail

  e2e:
    name: Tests (E2E, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: Tests (E2E)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: orochibraru/upload-artifact@v8
        with:
          name: playwright-report-sqlite
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  e2e-pg:
    name: Tests (E2E, PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: Tests (E2E, PostgreSQL)
        run: bun run test:e2e:pg

      - name: Upload Playwright report
        if: failure()
        uses: orochibraru/upload-artifact@v8
        with:
          name: playwright-report-pg
          path: playwright-report-pg/
          if-no-files-found: warn
          retention-days: 7
