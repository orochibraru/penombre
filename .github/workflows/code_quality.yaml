name: Code Quality
# Static checks and unit tests. E2E lives in `e2e.yaml`.
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Install scripts are off above; the agnix hook needs its binary.
      - name: Fetch the agnix binary
        run: bun node_modules/agnix/install.js

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Resolve prek version
        id: prek
        run: echo "version=$(jq -r .version node_modules/@j178/prek/package.json)" >> "$GITHUB_OUTPUT"

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          extra-args: --all-files --no-fail-fast

      - name: Circular imports
        run: bun run circular

      - name: Type check
        run: bun run check

  ts-test:
    name: Tests (TS)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Compile messages
        run: bun run gen:paraglide

      - name: Install ffmpeg and poppler
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      - name: Tests (Unit)
        run: bun test --bail

      - name: Tests (Go, unit)
        run: bun run test:go:unit

      - name: Tests (Go, integration)
        run: bun run test:go:integration
