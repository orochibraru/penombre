name: Desktop
# Builds Penombre Sync for every platform and attaches it to the release
# `v<version>`, which must already exist.

on:
  workflow_call:
    inputs:
      version:
        required: true
        description: "Release version without the v, e.g. 1.8.57 or 1.8.57-canary.3"
        type: string
    secrets:
      # A self-signed code-signing certificate (base64 of a .p12) and its
      # password. Without it the macOS binary keeps the linker's ad-hoc
      # signature, and the keychain asks for the API key after every update.
      MACOS_SIGNING_CERT:
        required: false
      MACOS_SIGNING_PASSWORD:
        required: false

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-built on the arm runner: no C toolchain beyond Xcode's.
          - target: x86_64-apple-darwin
            os: macos-latest
          # The oldest runner, for the oldest glibc the binary will need. No
          # -dev packages: X11, Wayland and GL are dlopened, D-Bus is Rust.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          toolchain="$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' Cargo.toml)"
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
          rustup default "$toolchain"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop
          key: ${{ matrix.target }}

      # Cargo.lock records the package's own version too, so both change or
      # `--locked` refuses to build. `\r?`: Windows checks out CRLF.
      - name: Stamp the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          perl -0pi -e 's/(\[package\]\r?\nname = "penombre-sync"\r?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.toml
          perl -0pi -e 's/(name = "penombre-sync"\r?\nversion = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock
          grep -qF "version = \"$VERSION\"" Cargo.toml
          grep -qF "version = \"$VERSION\"" Cargo.lock

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      # An ad-hoc signature is a hash of the binary, so each update is a new
      # app to the keychain and to privacy settings. A certificate's is not.
      - name: Sign the macOS binary
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "::warning::No MACOS_SIGNING_CERT secret: the binary keeps its ad-hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERT" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          binary="target/$TARGET/release/penombre-sync"
          codesign --force --keychain "$keychain" -s "Penombre Sync" --identifier dev.penombre.sync "$binary"
          codesign -d -r- "$binary"
          security delete-keychain "$keychain"

      # The archive is what the updater and the Homebrew formula read; the
      # .dmg, .exe and .AppImage are what people download.
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="$PWD/dist"
          mkdir -p "$out"
          bin="target/$TARGET/release"
          cp ../../LICENSE "$bin/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$bin" && 7z a -tzip "$out/penombre-sync-$TARGET.zip" penombre-sync.exe LICENSE)
            cp "$bin/penombre-sync.exe" "$out/penombre-sync-$TARGET.exe"
          else
            tar -czf "$out/penombre-sync-$TARGET.tar.gz" -C "$bin" penombre-sync LICENSE
          fi

      - name: Package the macOS app
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg"
          app="$stage/Penombre Sync.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/$TARGET/release/penombre-sync" "$app/Contents/MacOS/"
          iconset="$RUNNER_TEMP/icon.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" assets/icon.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
          # Bundle versions must be numeric: a canary's suffix is dropped.
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Penombre Sync</string>
            <key>CFBundleIdentifier</key><string>dev.penombre.sync</string>
            <key>CFBundleExecutable</key><string>penombre-sync</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION%%-*}</string>
            <key>CFBundleVersion</key><string>${VERSION%%-*}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Penombre Sync" -srcfolder "$stage" -ov -format UDZO "dist/penombre-sync-$TARGET.dmg"

      - name: Package the AppImage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o "$tools/runtime" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          (cd "$tools" && sha256sum -c) <<SUMS
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime
          SUMS
          chmod +x "$tools/appimagetool"
          appdir="$RUNNER_TEMP/Penombre.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp "target/$TARGET/release/penombre-sync" "$appdir/usr/bin/"
          ln -s usr/bin/penombre-sync "$appdir/AppRun"
          cp assets/icon.png "$appdir/penombre-sync.png"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Penombre Sync' \
            'Exec=penombre-sync' 'Icon=penombre-sync' 'Categories=Network;FileTransfer;' \
            > "$appdir/penombre-sync.desktop"
          # No FUSE on the runner: the tool runs from its own extracted copy.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tools/appimagetool" --no-appstream \
            --runtime-file "$tools/runtime" "$appdir" dist/penombre-sync-x86_64.AppImage

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          for asset in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
