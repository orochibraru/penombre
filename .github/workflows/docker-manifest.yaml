name: Docker Manifest
# Tags digests that `docker.yaml` pushed. Separate from the build so e2e can
# run in between.

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        description: "Subpath and image to push to, example myorg/myimage"
        type: string
      registry_name:
        required: true
        description: "Docker registry target to authenticate against and push to"
        type: string
      registry_username:
        required: true
        description: "Docker registry username"
        type: string
      bake_target:
        required: true
        description: "The target whose digests should be merged, e.g. app"
        type: string
    secrets:
      registry_password:
        required: false
    outputs:
      image-tag:
        description: "The primary image tag that was published"
        value: ${{ jobs.merge.outputs.image-tag }}

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.registry_name }}/${{ inputs.image_name }}
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  merge:
    name: Create Manifest and Tag then Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.inspect.outputs.tag }}
    steps:
      - name: Download meta bake definition
        uses: orochibraru/download-artifact@v8
        with:
          name: bake-meta-${{ inputs.bake_target }}
          path: ${{ runner.temp }}

      - name: Download digests
        uses: orochibraru/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.bake_target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Both expansions are deliberately unquoted: each produces several
          # separate argv words (one `-t <tag>` pair per tag, one ref per digest).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.target."docker-metadata-action".tags | map("-t " + .) | join(" ")' "$RUNNER_TEMP/bake-meta.json") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' "${{ runner.temp }}/bake-meta.json")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${{ env.IMAGE }}:$tag"
