name: E2E
# Runs Playwright against the already-built image rather than rebuilding it.
# Forks get no pushed digest, so `pulled: false` makes the suite build.

on:
  workflow_call:
    inputs:
      image:
        required: true
        description: "Registry path of the image under test, without a tag"
        type: string
      registry_name:
        required: true
        type: string
      registry_username:
        required: true
        type: string
      bake_target:
        required: true
        description: "Target whose amd64 digest artefact should be pulled"
        type: string
      pulled:
        required: false
        default: true
        description: "False when no image was pushed (forks), forcing a local build"
        type: boolean
    secrets:
      registry_password:
        required: false

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  NO_COLOR: "1"

jobs:
  e2e:
    name: Tests (E2E, ${{ matrix.dialect }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The budget, not a safety net: the app is fast, so the suite must be.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        dialect: [SQLite, PostgreSQL]
        # Each shard gets its own stack, so tests stay serial within one;
        # more shards is the only way to cut wall time until they are.
        shard: [1, 2, 3, 4]
        include:
          - dialect: SQLite
            script: test:e2e
            report: playwright-report
          - dialect: PostgreSQL
            script: test:e2e:pg
            report: playwright-report-pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Login to Container registry
        if: inputs.pulled
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      # The digest file is named after the digest.
      - name: Download amd64 digest
        if: inputs.pulled
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          name: digests-${{ inputs.bake_target }}-linux-amd64
          path: ${{ runner.temp }}/digest

      - name: Resolve and pull the image under test
        if: inputs.pulled
        run: |
          digest="$(find "${{ runner.temp }}/digest" -type f -printf '%f\n' | head -n1)"
          if [ -z "$digest" ]; then
            echo "::error::No digest artefact found for ${{ inputs.bake_target }} (linux/amd64)"
            exit 1
          fi
          ref="${{ inputs.image }}@sha256:${digest}"
          echo "Testing $ref"
          docker pull "$ref"
          echo "E2E_IMAGE=$ref" >> "$GITHUB_ENV"

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # About 30s per job otherwise, on every job of the matrix.
      - name: Cache Playwright's browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright's Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Tests (E2E, ${{ matrix.dialect }}, ${{ matrix.shard }}/4)
        run: bun run ${{ matrix.script }} --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: playwright-report-${{ matrix.dialect }}-${{ matrix.shard }}
          path: ${{ matrix.report }}
          retention-days: 7
