name: PR Cleanup
# Deletes the `pr-<number>` image once the PR is closed. A merged PR's image is
# deleted by publish.yaml instead, which may still be promoting it.

on:
  pull_request:
    types: [closed]
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string

concurrency:
  group: pr-cleanup-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  delete-image:
    name: Delete pr-${{ inputs.pr_number || github.event.pull_request.number }} image
    # A fork never published one.
    if: inputs.pr_number || (github.event.pull_request.head.repo.full_name ==
      github.repository && !github.event.pull_request.merged)
    runs-on: ubuntu-latest
    steps:
      # The package version carrying the tag. Its per-platform children stay
      # untagged; a public package's storage is free.
      - name: Delete the tag from ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: orochibraru
          PACKAGE: penombre
          TAG: pr-${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          versions="users/$OWNER/packages/container/$PACKAGE/versions"
          ids="$(gh api --paginate "$versions" \
            --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id")"
          id="${ids%%$'\n'*}"
          # None is normal: e2e failed, so the tag was never published.
          if [ -z "$id" ]; then
            echo "No $PACKAGE:$TAG to delete"
            exit 0
          fi
          gh api -X DELETE "$versions/$id"
          echo "Deleted $PACKAGE:$TAG"
