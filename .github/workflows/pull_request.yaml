name: Pull Request
on:
  pull_request:
  # releaser pushes this branch over a deploy key before the PR exists, so its
  # first commit only gets a push run.
  push:
    branches: [releaser/release]

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

# Every called workflow reads the repo only; images go to ghcr.io.
permissions:
  contents: read

# code quality → build (by digest) → e2e → tag `pr-<number>`.
jobs:
  changes:
    name: Detect Release PR
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      desktop: ${{ steps.desktop.outputs.desktop }}
      mobile: ${{ steps.mobile.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release PR must bump nothing but the version: the images it ships are
      # the last canary's, so there is nothing to build.
      - name: Check a release PR only bumps the version
        id: diff
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "releaser/release" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git merge-base HEAD origin/main)"
          other="$(git diff --name-only "$base" HEAD | grep -vxE 'CHANGELOG\.md|package\.json' || true)"
          if [ -n "$other" ] || [ "$(git show "$base:package.json" | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' package.json)" ]; then
            echo "::error::The release PR changes more than CHANGELOG.md and package.json's version."
            echo "$other"
            exit 1
          fi
          echo "Release PR: only the version and CHANGELOG.md change, nothing to build."
          echo "build=false" >> "$GITHUB_OUTPUT"

      - name: Check whether the desktop app changed
        id: desktop
        run: |
          set -euo pipefail
          if [ -n "$(git diff --name-only "$(git merge-base HEAD origin/main)" HEAD -- desktop)" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the mobile app changed
        id: mobile
        run: |
          set -euo pipefail
          if [ -n "$(git diff --name-only "$(git merge-base HEAD origin/main)" HEAD -- mobile)" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          fi

  code_quality:
    name: Code Quality
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/code_quality.yaml

  # Formatting runs with every other pre-commit hook in Code Quality.
  desktop:
    name: Desktop (clippy, tests)
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          toolchain="$(sed -n 's/^rust-version = "\([^"]*\)".*/\1/p' desktop/Cargo.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup default "$toolchain"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve prek version
        id: prek
        run: echo "version=$(jq -r .version node_modules/@j178/prek/package.json)" >> "$GITHUB_OUTPUT"

      - name: Clippy and tests
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          extra-args: --all-files --hook-stage pre-push clippy test-rust

  # The shared code's unit tests on the JVM. The Maestro flows need an emulator,
  # a simulator and a server: they run locally (`mise run mobile:e2e`).
  mobile:
    name: Mobile (tests)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK mise.toml pins for local builds.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve prek version
        id: prek
        run: echo "version=$(jq -r .version node_modules/@j178/prek/package.json)" >> "$GITHUB_OUTPUT"

      - name: Tests
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          extra-args: --all-files --hook-stage pre-push test-mobile

  # Both apps, built as a release builds them and attached nowhere: a Kotlin/
  # Native link error only shows when the iOS framework is linked.
  mobile-build:
    name: Mobile (build)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/mobile.yaml
    with:
      version: 0.0.0-canary.0

  build-app:
    name: Docker Build (App)
    needs: [code_quality]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
      # Forks get no secrets; the build still warms the cache.
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}
      image_name: orochibraru/penombre
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app

  e2e:
    name: E2E
    needs: [build-app]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app
      pulled: ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}

  publish:
    name: Publish pr-${{ github.event.pull_request.number }}
    needs: [e2e]
    # A fork pushed no digests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/penombre
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app

  gate:
    name: CI Gate
    if: always()
    needs:
      [
        changes,
        code_quality,
        desktop,
        mobile,
        mobile-build,
        build-app,
        e2e,
        publish,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.changes.result }}"
            "${{ needs.code_quality.result }}"
            "${{ needs.desktop.result }}"
            "${{ needs.mobile.result }}"
            "${{ needs.mobile-build.result }}"
            "${{ needs.build-app.result }}"
            "${{ needs.e2e.result }}"
            "${{ needs.publish.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All checks passed (skipped jobs are OK)"
