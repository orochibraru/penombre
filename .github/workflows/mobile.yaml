name: Mobile
# Builds the Android and iOS apps. Called by a release with `upload`, which
# attaches them to `v<version>` (it must already exist), and by a pull request
# that touches `mobile/` without it, as a build check.

on:
  workflow_call:
    inputs:
      version:
        required: true
        description: "Release version without the v, e.g. 1.8.57 or 1.8.57-canary.3"
        type: string
      upload:
        required: false
        default: false
        description: "Attach the builds to the release v<version>"
        type: boolean
    secrets:
      # The Android signing key, base64 of the .jks (CLAUDE.md says how it is
      # made). Without it the APK is built unsigned and not attached.
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The JDK mise.toml pins for local builds.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Only in the runner's temp folder, and only when there is a key.
      - name: Write the signing key
        id: key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE secret: the APK is built unsigned and not attached to the release."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/penombre.jks"
          echo "file=$RUNNER_TEMP/penombre.jks" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            "-Ppenombre.version=$VERSION" "-Ppenombre.code=$(sh version-code.sh "$VERSION")"

      # An APK to install by hand, and the bundle the Play Store takes.
      - name: Package
        if: steps.key.outputs.file != ''
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/penombre-android.apk
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab dist/penombre-android.aab
          cd dist
          for asset in *; do
            sha256sum "$asset" > "$asset.sha256"
            cat "$asset.sha256"
          done

      - name: Upload to the release
        if: inputs.upload && steps.key.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate -q

      # Unsigned: signing needs an Apple developer account. A sideloading tool
      # signs it on the way to a phone; the App Store build will need its own.
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/Penombre.xcodeproj -scheme Penombre \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "MARKETING_VERSION=${VERSION%%-*}" \
            "CURRENT_PROJECT_VERSION=$(sh version-code.sh "$VERSION")" \
            build

      # An .ipa is a zip with the app under Payload/.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/Penombre.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$OLDPWD/dist/penombre-ios-unsigned.ipa" Payload)
          cd dist
          shasum -a 256 penombre-ios-unsigned.ipa > penombre-ios-unsigned.ipa.sha256
          cat penombre-ios-unsigned.ipa.sha256

      - name: Upload to the release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
