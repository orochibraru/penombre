name: Publish
on:
  push:
    branches:
      - main
    # `paths`, not `paths-ignore`: only `paths` takes exceptions, and a merged
    # release PR can touch CHANGELOG.md alone. Ignoring it skipped the release.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.agents/**"
      - "!.claude/**"
      - "CHANGELOG.md"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  # Every type bumps, so every merge ships a canary: a push with nothing
  # release-worthy would still rebuild the release PR, which would then carry
  # code no canary image was built from.
  RELEASE_RULES: breaking=major,feat=patch,docs=patch,refactor=patch,style=patch,test=patch,build=patch,ci=patch,chore=patch

# Jobs widen their own. CI's images live on ghcr.io; Docker Hub only gets the
# published tags (version, canary, latest), so CI never pulls from it.
permissions:
  contents: read

# Every merge is a canary: `X.Y.Z-canary.N` and `:canary`, promoted from the
# merged PR's tested image when the tree matches, built from scratch otherwise.
# releaser keeps a `chore(release): X.Y.Z` PR open; merging it re-tags that
# version's last canary as `:X.Y.Z` and `:latest`, rebuilding nothing.
jobs:
  version:
    name: Resolve Release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.releaser.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dry-run release to compute the next version
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: ${{ env.RELEASE_RULES }}
          prerelease: canary
          release-pr: "true"
          dry-run: "true"

      - name: Tell a merged release PR from a canary push
        id: mode
        env:
          VERSION: ${{ steps.releaser.outputs.version }}
          PRERELEASE: ${{ steps.releaser.outputs.prerelease }}
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^chore\(release\):\ [0-9]+\.[0-9]+\.[0-9]+(\ \(#[0-9]+\))?$ ]]; then
            if [ -z "$VERSION" ] || [ "$PRERELEASE" != "false" ]; then
              echo "::error::Merged release PR ($subject), but releaser would release '$VERSION'."
              exit 1
            fi
            echo "Merged release PR: releasing $VERSION from its canary."
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "This push publishes canary $VERSION."
            echo "mode=canary" >> "$GITHUB_OUTPUT"
          else
            echo "No Conventional Commit since the last canary: nothing to publish."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

  tested:
    name: Find Tested PR Image
    needs: [version]
    if: needs.version.outputs.mode == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      image: ${{ steps.find.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Match the merged PR's image by source tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/orochibraru/penombre
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          [ -n "$pr" ] || { echo "Not a PR merge."; exit 0; }

          ref="$IMAGE:pr-$pr"
          if ! manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null)"; then
            echo "No $ref published."; exit 0
          fi
          tree="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
            | jq -r '.["linux/amd64"].config.Labels["dev.penombre.tree"] // empty')"
          if [ "$tree" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "$ref was built from tree '${tree}', not this commit's."; exit 0
          fi
          digest="$(jq -r .digest <<<"$manifest")"
          echo "Promoting $ref ($digest)"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  code_quality:
    name: Code Quality
    needs: [tested]
    if: needs.tested.outputs.image == ''
    uses: ./.github/workflows/code_quality.yaml

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - version
    permissions:
      contents: read
      packages: write
    with:
      image_tag: ${{ needs.version.outputs.version }}
      extra_tag: canary
      app_version: ${{ needs.version.outputs.version }}
      image_name: orochibraru/penombre
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app
    secrets:
      registry_password: ${{ github.token }}

  e2e:
    name: E2E
    needs: [build-app]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app
    secrets:
      registry_password: ${{ github.token }}

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/penombre
      registry_name: ghcr.io
      registry_username: ${{ github.actor }}
      bake_target: app
      mirror_registry: docker.io
      mirror_username: orochibraru
    secrets:
      registry_password: ${{ github.token }}
      mirror_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  promote:
    name: Promote ${{ needs.version.outputs.version }}
    needs: [tested, version]
    if: needs.tested.outputs.image != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # No RUN step, so both platforms build natively in seconds. The PR image
      # reports package.json's version; the ENV corrects it.
      - name: Tag the tested image
        env:
          SOURCE: ${{ needs.tested.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'FROM %s\nENV PENOMBRE_RELEASE_VERSION=%s\n' "$SOURCE" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 --push \
              -t "docker.io/orochibraru/penombre:$VERSION" \
              -t docker.io/orochibraru/penombre:canary \
              -t "ghcr.io/orochibraru/penombre:$VERSION" \
              -t ghcr.io/orochibraru/penombre:canary -

  stable-images:
    name: Promote Canary to ${{ needs.version.outputs.version }}
    needs: [version]
    if: needs.version.outputs.mode == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the canary is what this release ships
        id: canary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$(git tag --list "v$VERSION-canary.*" --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "::error::No v$VERSION-canary.* tag to release."
            exit 1
          fi
          sha="$(git rev-parse "$tag^{commit}")"
          drift="$(git diff --name-only "$sha" HEAD -- . ':(glob,exclude)docs/**' ':(glob,exclude)**/*.md' ':(glob,exclude).agents/**' ':(glob,exclude).claude/**' ':(exclude)package.json')"
          if [ -n "$drift" ] || [ "$(git show "$sha:package.json" | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' package.json)" ]; then
            echo "::error::The release PR carries changes $tag wasn't built from. Let Publish finish on main, then re-run this workflow."
            echo "$drift"
            exit 1
          fi
          echo "Releasing $tag ($sha)."
          echo "image=ghcr.io/orochibraru/penombre:${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Tag the canary image
        env:
          SOURCE: ${{ steps.canary.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'FROM %s\nENV PENOMBRE_RELEASE_VERSION=%s\n' "$SOURCE" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 --push \
              -t "docker.io/orochibraru/penombre:$VERSION" \
              -t docker.io/orochibraru/penombre:latest \
              -t docker.io/orochibraru/penombre:canary \
              -t "ghcr.io/orochibraru/penombre:$VERSION" \
              -t ghcr.io/orochibraru/penombre:latest \
              -t ghcr.io/orochibraru/penombre:canary -

  release:
    name: Release ${{ needs.version.outputs.version }}
    runs-on: ubuntu-latest
    needs: [version, publish, promote, stable-images]
    if:
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.publish.result == 'success' || needs.promote.result == 'success' ||
      needs.stable-images.result == 'success') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pushes over a deploy key trigger workflows, unlike github.token, so the
      # release PR gets its CI Gate. It needs write access and a bypass on the
      # tag and branch rulesets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # releaser pushes over the key this persists
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }} # zizmor: ignore[artipacked]

      - name: Tag, release and update the release PR
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: ${{ env.RELEASE_RULES }}
          prerelease: canary
          release-pr: "true"
          # Releases are immutable once published: the desktop builds attach
          # to the draft, and `publish-release` publishes it.
          draft: "true"

      - name: Fail if the release doesn't match the images
        if: steps.releaser.outputs.version != needs.version.outputs.version
        env:
          RELEASED: ${{ steps.releaser.outputs.version }}
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          echo "::error::releaser released '$RELEASED', but the images were tagged '$EXPECTED'."
          exit 1

      # Releases only: the canary tags stay, releaser numbers from them.
      - name: Keep only the last five canary releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes

  desktop:
    name: Desktop ${{ needs.version.outputs.version }}
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  # Published even when a desktop build failed: the server release must not
  # wait on it, and a draft is invisible to everyone else.
  publish-release:
    name: Publish Release ${{ needs.version.outputs.version }}
    needs: [version, release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MODE: ${{ needs.version.outputs.mode }}
        run: |
          latest=false
          [ "$MODE" = stable ] && latest=true
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  # The tap's formula is rendered here, per release, from the checksums the
  # desktop jobs attached. The tap has no workflow of its own.
  homebrew:
    name: Homebrew Tap
    needs: [version, desktop, publish-release]
    if: ${{ !cancelled() && needs.desktop.result == 'success' &&
      needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          MODE: ${{ needs.version.outputs.mode }}
        run: |
          set -euo pipefail
          # Canaries go to their own formula; `@canary` is not a name Homebrew
          # can turn into a class.
          if [ "$MODE" = stable ]; then
            formula=penombre-sync class=PenombreSync other=penombre-sync-canary
          else
            formula=penombre-sync-canary class=PenombreSyncCanary other=penombre-sync
          fi
          echo "FORMULA=$formula" >> "$GITHUB_ENV"
          sums="$RUNNER_TEMP/sums"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz.sha256' --dir "$sums"
          args=(-e "s/@VERSION@/$VERSION/" -e "s/@CLASS@/$class/" -e "s/@OTHER@/$other/")
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            args+=(-e "s/@SHA256_$target@/$(cut -d' ' -f1 "$sums/penombre-sync-$target.tar.gz.sha256")/")
          done
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          sed "${args[@]}" packaging/homebrew/penombre-sync.rb.tmpl > "$RUNNER_TEMP/tap/Formula/$formula.rb"
          cp packaging/homebrew/README.md "$RUNNER_TEMP/tap/README.md"
          if grep -n '@[A-Za-z0-9_-]*@' "$RUNNER_TEMP/tap/Formula/$formula.rb"; then
            echo "::error::Unrendered placeholder in the formula."
            exit 1
          fi

      # A deploy key, not a token: it reaches the tap and nothing else. GitHub's
      # host keys come from its API over TLS rather than a first-use scan. The
      # fetch finds nothing on the tap's very first push.
      - name: Push to orochibraru/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/tap_key"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$key")
          curl -fsS https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          cd "$RUNNER_TEMP/tap"
          git init -q -b main
          git remote add origin git@github.com:orochibraru/homebrew-tap.git
          if git fetch -q --depth 1 origin main; then
            git reset -q FETCH_HEAD
          fi
          git add "Formula/$FORMULA.rb" README.md
          if git diff --cached --quiet; then
            echo "The tap already carries $FORMULA $VERSION."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$FORMULA $VERSION"
          git push origin main

  cleanup:
    name: Delete PR Image
    needs: [tested, release]
    if: always() && needs.tested.outputs.pr != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pr-cleanup.yaml
    with:
      pr_number: ${{ needs.tested.outputs.pr }}
