name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml
    secrets: inherit

  version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      # CI_TOKEN, not the default GITHUB_TOKEN: the dry run still verifies push
      # access with `git push --dry-run`, and the `main` ruleset denies
      # github-actions[bot]. With the default token that 403s, semantic-release
      # aborts before printing a version, and image tags silently fall back to
      # the commit SHA. Same reason as the `release` job below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Dry-run release to compute the next version
        id: compute
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          output="$(bun run semantic-release --dry-run 2>&1)" || true
          echo "$output"
          version="$(echo "$output" | grep -oE 'release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)"
          if [ -n "$version" ]; then
            echo "This push will release v$version, tagging images accordingly."
            # Unprefixed: the release notes say `docker pull …:{{version}}`.
            echo "tag=$version" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, falling back to the commit SHA for image tags."
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - version
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/penombre
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  e2e:
    name: E2E
    needs: [build-app]
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, e2e]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/penombre
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - version
      - build-app
      - e2e
      - publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # CI_TOKEN (a PAT scoped to this repo, Contents + Issues + Pull requests:
      # write) is required, not the default GITHUB_TOKEN: the `main` ruleset
      # blocks direct pushes from anyone but a repo admin, and the default
      # token's actor (github-actions[bot]) isn't on the bypass list. Used both
      # for git's push auth here and as GH_TOKEN below for
      # @semantic-release/github's API calls.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: bun run release
