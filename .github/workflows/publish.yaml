name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

# A merged PR already built and e2e-tested this exact tree as `pr-<number>`, so
# `tested` finds that image and `promote` re-tags it with the release version.
# Anything else (a direct push, a fork, a stale PR run) takes the full
# build → e2e → publish path.
jobs:
  tested:
    name: Find Tested PR Image
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      image: ${{ steps.find.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Match the merged PR's image by source tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: docker.io/orochibraru/penombre
        run: |
          pr="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          [ -n "$pr" ] || { echo "Not a PR merge."; exit 0; }

          ref="$IMAGE:pr-$pr"
          if ! manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null)"; then
            echo "No $ref published."; exit 0
          fi
          tree="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
            | jq -r '.["linux/amd64"].config.Labels["dev.penombre.tree"] // empty')"
          if [ "$tree" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "$ref was built from tree '${tree}', not this commit's."; exit 0
          fi
          digest="$(jq -r .digest <<<"$manifest")"
          echo "Promoting $ref ($digest)"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  code_quality:
    name: Code Quality
    needs: [tested]
    if: needs.tested.outputs.image == ''
    uses: ./.github/workflows/code_quality.yaml
    secrets: inherit

  version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      # CI_TOKEN, not the default GITHUB_TOKEN: the dry run still verifies push
      # access with `git push --dry-run`, and the `main` ruleset denies
      # github-actions[bot]. With the default token that 403s, semantic-release
      # aborts before printing a version, and image tags silently fall back to
      # the commit SHA. Same reason as the `release` job below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Dry-run release to compute the next version
        id: compute
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          output="$(bun run semantic-release --dry-run 2>&1)" || true
          echo "$output"
          version="$(echo "$output" | grep -oE 'release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)"
          if [ -n "$version" ]; then
            echo "This push will release v$version, tagging images accordingly."
            # Unprefixed: the release notes say `docker pull …:{{version}}`.
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            # Baked into the image so it reports the version it is tagged with.
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, falling back to the commit SHA for image tags."
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - version
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      app_version: ${{ needs.version.outputs.version }}
      image_name: orochibraru/penombre
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  e2e:
    name: E2E
    needs: [build-app]
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, e2e]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/penombre
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_HUB_TOKEN }}

  promote:
    name: Promote ${{ needs.version.outputs.tag }}
    needs: [tested, version]
    if: needs.tested.outputs.image != ''
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # No RUN step, so both platforms build natively in seconds. The PR image
      # reports package.json's pre-release version; the ENV corrects it.
      - name: Tag the tested image
        env:
          SOURCE: ${{ needs.tested.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "FROM $SOURCE"
            if [ -n "$VERSION" ]; then echo "ENV PENOMBRE_RELEASE_VERSION=$VERSION"; fi
          } | docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "docker.io/orochibraru/penombre:$TAG" \
            -t docker.io/orochibraru/penombre:latest -

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, publish, promote]
    if: always() && needs.version.result == 'success' && (needs.publish.result ==
      'success' || needs.promote.result == 'success')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # CI_TOKEN (a PAT scoped to this repo, Contents + Issues + Pull requests:
      # write) is required, not the default GITHUB_TOKEN: the `main` ruleset
      # blocks direct pushes from anyone but a repo admin, and the default
      # token's actor (github-actions[bot]) isn't on the bypass list. Used both
      # for git's push auth here and as GH_TOKEN below for
      # @semantic-release/github's API calls.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: bun run release

  cleanup:
    name: Delete PR Image
    needs: [tested, release]
    if: always() && needs.tested.outputs.pr != ''
    uses: ./.github/workflows/pr-cleanup.yaml
    with:
      pr_number: ${{ needs.tested.outputs.pr }}
    secrets:
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
