rules:
  # Suggests `uses: $/...` for local reusable workflows; actionlint does not
  # parse that syntax yet.
  self-repository:
    disable: true
  # Flagged for its `push` trigger, which is releaser/release only and never
  # runs a cache-writing job; a PR's cache is scoped to its own ref.
  cache-poisoning:
    ignore:
      - pull_request.yaml
